<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PROTEIN &amp; COSMETICS</title><meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f5f5f2;--ink:#111;--mut:#6b6b66;--gold:#f5c400;--line:#e5e5df}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:100px}
header{background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:10}
.br{display:flex;justify-content:space-between;align-items:baseline}.br b{color:var(--gold);letter-spacing:1px;font-size:18px}.br span{font-size:12px;color:#bbb}
#q{width:100%;margin:10px 0 8px;padding:11px 14px;border:0;border-radius:12px;font-size:16px}
#ch{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:20px;background:#2a2a2a;color:#ddd;font-size:14px;border:0}.chip.on{background:var(--gold);color:var(--ink);font-weight:700}
h2{font-size:17px;margin:18px 14px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.im{aspect-ratio:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#d6d6d0;font-size:38px;font-weight:700;background:#fafaf8}.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nm{padding:8px 10px 0;font-size:15px;font-weight:600;line-height:1.35;flex:1}.pr{padding:2px 10px 8px;font-size:14px;color:var(--mut)}.pr b{font-size:17px;color:var(--ink)}
.add{margin:0 10px 10px;padding:9px;border:0;border-radius:10px;background:var(--ink);color:var(--gold);font-weight:700;font-size:15px}
.qty{margin:0 10px 10px;display:flex;align-items:center;justify-content:space-between;background:var(--gold);border-radius:10px}.qty button{width:42px;height:38px;border:0;background:none;font-size:22px;font-weight:700}.qty span{font-weight:700;font-size:16px}
#bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border:0;border-radius:16px;padding:14px 18px;display:none;justify-content:space-between;font-size:16px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.3)}#bar b{color:var(--gold)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:30;align-items:flex-end}
#pn{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px;font-size:15px}.row .qty{margin:0;min-width:112px}
.f{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin:6px 0;font-family:inherit;display:block}.er{color:#c0392b;font-size:14px;margin-top:8px;min-height:18px}.lb{font-size:13px;color:var(--mut);margin-top:10px}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-top:12px}
.send{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;background:#25d366;color:#fff;font-size:17px;font-weight:700}
.nt{width:100%;margin-top:4px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit}
#wa{position:fixed;left:14px;bottom:calc(86px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:19}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:50;display:none;touch-action:none;overflow:hidden}
#lb img{position:absolute;left:50%;top:50%;width:100vw;height:100vh;object-fit:contain;transform:translate(-50%,-50%);user-select:none;-webkit-user-drag:none;pointer-events:none}
#lbx{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:24px;z-index:2}
#lbh{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#aaa;font-size:13px;pointer-events:none}
.im img{cursor:zoom-in}
.vs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}.vs::-webkit-scrollbar{display:none}
.vsl{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column}


.vn{padding:2px 10px 0;font-size:14px;font-weight:700;color:#9a7b00}.vd{padding:2px 10px 0;font-size:12.5px;color:var(--mut);line-height:1.5;white-space:pre-line}
.vw{position:relative}.vov{position:absolute;top:0;left:0;right:0;aspect-ratio:1;display:flex;align-items:flex-end;padding:6px;pointer-events:none}
.dots{display:flex;justify-content:center;gap:6px;padding:2px 0 12px}.dots i{width:7px;height:7px;border-radius:4px;background:#d6d6d0;transition:width .2s}.dots i.on{background:var(--ink);width:20px}
.gbadge{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:2px 8px;border-radius:10px;pointer-events:none}
#lbp,#lbq{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:28px;line-height:1;z-index:2;display:none}
#lbp{left:10px}#lbq{right:10px}
#lbn{position:absolute;top:calc(24px + env(safe-area-inset-top));left:16px;color:#fff;font-size:15px;font-weight:700;pointer-events:none}
.gb{background:#fff;color:var(--ink);border:2px solid var(--ink);margin-top:-4px}.clr{background:none;border:0;color:var(--mut);margin-top:10px;width:100%;font-size:14px}.emp{text-align:center;color:var(--mut);padding:40px 0}
.im img{opacity:0;transition:opacity .35s}.im img.ld{opacity:1}.im:has(img:not(.ld):not(.tb)){background:linear-gradient(90deg,#efefea 25%,#fafaf8 50%,#efefea 75%);background-size:200% 100%;animation:shm 1.2s linear infinite}@keyframes shm{to{background-position:-200% 0}}
.im img.tb{opacity:1;filter:blur(8px);transform:scale(1.2);transition:none}
.dt{margin:0 10px 10px;padding:7px;border:0;background:none;color:#9a7b00;font-weight:700;font-size:13px;text-align:center}
.nb{margin:12px 14px 0;padding:12px 14px;border-radius:12px;background:var(--gold);color:var(--ink);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;animation:nbp 1.6s ease-in-out infinite}.nb i{font-style:normal;padding:2px 10px;font-size:18px}@keyframes nbp{50%{box-shadow:0 0 0 5px rgba(245,196,0,.35)}}
@keyframes slin{from{transform:translateX(var(--dx,0));opacity:.4}to{transform:none;opacity:1}}
</style></head><body>
<header><div class="br"><b id="bn">PROTEIN &amp; COSMETICS</b><span>أسعار الجملة</span></div>
<input id="q" type="search" placeholder="ابحث عن منتج..." oninput="term=this.value;draw()"><div id="ch"></div><div id="imbar"></div></header>
<main id="m"></main>
<div id="lb"><button id="lbx" onclick="lbClose()">✕</button><button id="lbp" onclick="lbGo(-1)">‹</button><button id="lbq" onclick="lbGo(1)">›</button><div id="lbn"></div><img alt=""><div id="lbh">بإصبعين للتكبير • دوس مرتين للتقريب • اسحب يمين أو شمال للصورة اللي بعدها</div></div>
<a id="wa" aria-label="واتساب" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="32" height="32" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg></a>
<button id="bar" onclick="openCart()"><span id="bc"></span><b id="bt"></b></button>
<div id="sh" onclick="if(event.target===this){this.style.display='none';pv=null}"><div id="pn"></div></div>
<script>
function showErr(t){var d=document.getElementById('err');if(!d){d=document.createElement('div');d.id='err';d.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#c0392b;color:#fff;padding:10px 12px;font-size:13px;z-index:99999;direction:ltr;text-align:left;word-break:break-all';(document.body||document.documentElement).appendChild(d)}d.textContent=t}
window.onerror=function(m,u,l){showErr('خطأ: '+m+' @'+String(u).split('/').pop()+':'+l)};
setTimeout(function(){if(!window.__drawn)showErr('الصفحة لسه بتحمّل... لو فضلت كده حدّث الصفحة')},12000);
</script>
<script src="thumbs.js" onerror="void 0"></script>
<script src="products.js" onerror="showErr('ملف products.js ماتحملش')"></script>
<script>
var IMGS={};
function IM(k){return 'img-'+k+'.jpg'}
function TB(k){return typeof IMGT!=='undefined'&&IMGT[k]?'<img class="tb" alt="" src="'+IMGT[k]+'">':''}
window.addEventListener('load',function(){var l=[];try{CATALOG.sections.forEach(function(s){s.items.forEach(function(x){if(x.img)l.push(IM(x.id));(x.gal||[]).forEach(function(g){l.push(IM(g))});(x.variants||[]).forEach(function(v){if(v.img)l.push(IM(v.id))})})})}catch(e){}var i=0;function nx(){if(i>=l.length)return;var m=new Image();m.onload=m.onerror=nx;m.src=l[i++]}for(var j=0;j<3;j++)nx()});
var cart={},cat='all',term='',P={},fmt=function(n){return n.toLocaleString('en-US')},sdir=0,nbHide=false,NEW=[];
function lsGet(){try{return parseInt(localStorage.getItem('lastSeen')||'0')||0}catch(e){return 0}}
function lsSet(){try{localStorage.setItem('lastSeen',String(Date.now()))}catch(e){}}
(function(){var ls=lsGet(),now=Date.now();if(!ls){lsSet();return}CATALOG.sections.forEach(function(s){s.items.forEach(function(x){if(x.added&&x.added>ls&&now-x.added<14*864e5)NEW.push(x)})});NEW.sort(function(a,b){return b.added-a.added})})();
function showNew(){lsSet();nbHide=true;setCat('new');window.scrollTo(0,0)}
function dismissNew(){lsSet();nbHide=true;draw()}
function nbar(){return NEW.length&&!nbHide&&cat!=='new'?'<div class="nb" onclick="showNew()"><span>🆕 فيه '+NEW.length+(NEW.length>10?' منتج جديد':' '+(NEW.length==1?'منتج جديد':'منتجات جديدة'))+' اتضافت — اضغط تشوفها</span><i onclick="event.stopPropagation();dismissNew()">✕</i></div>':''}
function swipeCat(d){var o=['all'];CATALOG.sections.forEach(function(_,i){o.push(i)});var c=o.indexOf(cat);if(c<0)return;var n=c+d;if(n<0||n>=o.length)return;sdir=d;setCat(o[n]);window.scrollTo(0,0)}
(function(){var mm=document.getElementById('m'),sx=0,sy=0,ok=false;
mm.addEventListener('touchstart',function(e){if(e.touches.length!==1||e.target.closest('.vs,input,textarea')){ok=false;return}ok=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
mm.addEventListener('touchend',function(e){if(!ok)return;ok=false;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6)return;swipeCat(dx<0?1:-1)},{passive:true})})();
try{cart=JSON.parse(localStorage.getItem('cart')||'{}')}catch(e){}
CATALOG.sections.forEach(function(s){s.items.forEach(function(i){P[i.id]=i})});
document.getElementById('bn').textContent=CATALOG.brand;document.title=CATALOG.brand;
function norm(s){return s.replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase()}
function save(){try{localStorage.setItem('cart',JSON.stringify(cart))}catch(e){}}
function setCat(c){cat=c;draw()}
function ctl(id){var q=cart[id]||0;return q?'<div class="qty"><button onclick="chg(\''+id+'\',1)">+</button><span>'+q+'</span><button onclick="chg(\''+id+'\',-1)">−</button></div>':'<button class="add" onclick="chg(\''+id+'\',1)">+ أضف</button>'}
function draw(){
  var sc={};document.querySelectorAll('.vs').forEach(function(e){sc[e.dataset.id]=e.scrollLeft});
  var h='<button class="chip'+(cat=='all'?' on':'')+'" onclick="setCat(\'all\')">الكل</button>';
  if(NEW.length)h+='<button class="chip'+(cat==='new'?' on':'')+'" onclick="setCat(\'new\')">🆕 جديد</button>';
  CATALOG.sections.forEach(function(s,i){h+='<button class="chip'+(cat===i?' on':'')+'" onclick="setCat('+i+')">'+s.name+'</button>'});
  document.getElementById('ch').innerHTML=h;
  var t=norm(term.trim()),o='';
  (cat==='new'?[{name:'🆕 منتجات جديدة',items:NEW}]:CATALOG.sections).forEach(function(s,i){
    if(cat!='all'&&cat!=='new'&&cat!==i)return;
    var it=s.items.filter(function(x){return !t||norm(x.name).indexOf(t)>-1});if(!it.length)return;
    o+='<h2>'+s.name+'</h2><div class="grid">'+it.map(function(x){
      if(x.variants&&x.variants.length)return vcard(x);
      return '<div class="card"><div class="im">'+(x.img&&IM(x.id)?TB(x.id)+'<img decoding="async" onload="this.classList.add(\'ld\')" onerror="this.style.display=\'none\';this.classList.add(\'ld\')" src="'+IM(x.id)+'" alt="" onclick="zoomItem(\''+x.id+'\')">':(x.variants&&x.variants[0]&&x.variants[0].img&&IM(x.variants[0].id))?'<img decoding="async" onload="this.classList.add(\'ld\')" onerror="this.style.display=\'none\';this.classList.add(\'ld\')" src="'+IM(x.variants[0].id)+'" alt="" onclick="zoomImg(this.src)">':x.name.charAt(0))+(x.gal&&x.gal.length&&x.img?'<span class="gbadge">📷 '+(x.gal.length+1)+'</span>':'')+'</div><div class="nm">'+x.name+'</div><div class="pr">'+(x.variants&&vmin(x)<x.price?'من ':'')+'<b>'+fmt(x.variants?vmin(x):x.price)+'</b> ج.م'+(x.gram?' / لتر':x.parts?' / المجموعة':'')+'</div>'+(x.variants?vbtn(x):ctl(x.id))+(x.gram?gbtn(x):'')+(x.parts?pbtn(x):'')+dbtn(x)+'</div>'}).join('')+'</div>'});
  document.getElementById('m').innerHTML=nbar()+(o||'<div class="emp">مفيش نتائج</div>');
  if(sdir){var mm=document.getElementById('m');mm.style.setProperty('--dx',(sdir>0?-40:40)+'px');mm.style.animation='none';void mm.offsetWidth;mm.style.animation='slin .25s ease-out';var on=document.querySelector('#ch .chip.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});sdir=0}
  document.querySelectorAll('.vs').forEach(function(e){e.scrollLeft=sc[e.dataset.id]||0;vdot(e)});
  bar();
}
function vdot(el){var cd=el.closest('.card'),i=Math.round(Math.abs(el.scrollLeft)/(el.clientWidth||1)),d=cd.querySelectorAll('.dots i'),c=cd.querySelector('.vcn');for(var j=0;j<d.length;j++)d[j].className=j===i?'on':'';if(c)c.textContent=i+1}
function vcard(x){var n=x.variants.length;return '<div class="card"><div class="vw"><div class="vs" data-id="'+x.id+'" onscroll="vdot(this)">'+x.variants.map(function(v){return '<div class="vsl"><div class="im">'+(v.img&&IM(v.id)?TB(v.id)+'<img decoding="async" onload="this.classList.add(\'ld\')" onerror="this.style.display=\'none\';this.classList.add(\'ld\')" src="'+IM(v.id)+'" alt="" onclick="zoomImg(this.src)">':v.n.charAt(0))+'</div><div class="nm" style="flex:none">'+x.name+'</div><div class="vn">'+v.n+'</div>'+(v.d?'<div class="vd">'+esc(v.d)+'</div>':'')+'<div style="flex:1"></div><div class="pr" style="padding-top:6px"><b>'+fmt(v.p||x.price)+'</b> ج.م</div>'+ctl(x.id+'@'+v.id)+gbtnV(x,v)+'</div>'}).join('')+'</div><div class="vov"><span class="gbadge" style="position:static">اسحب وشوف الأشكال • <span class="vcn">1</span>/'+n+'</span></div></div><div class="dots">'+x.variants.map(function(v,j){return '<i class="'+(j?'':'on')+'"></i>'}).join('')+'</div>'+dbtn(x)+'</div>'}
function dbtn(x){return x.desc?'<button class="dt" onclick="descUI(\''+x.id+'\')">التفاصيل</button>':''}
function descUI(id){var p=P[id];if(!p||!p.desc)return;pv=null;document.getElementById('sh').style.display='flex';document.getElementById('pn').innerHTML='<h2 style="margin:0 0 10px">'+esc(p.name)+'</h2>'+(p.img&&IM(id)?'<img src="'+IM(id)+'" alt="" onclick="zoomImg(this.src)" onerror="this.style.display=\'none\'" style="width:100%;max-height:38vh;object-fit:contain;border-radius:12px;background:#fafaf8;margin-bottom:12px">':'')+'<div style="white-space:pre-line;line-height:1.8;font-size:15px">'+esc(p.desc)+'</div><button class="send" style="background:#111;color:#f5c400" onclick="closeSh()">تم</button>'}
function pid(k){return k.split(/[~@]/)[0]}
function isV(k){return k.indexOf('@')>0}
function vOf(k){var id=k.split('@')[1].split('~')[0];return (P[pid(k)].variants||[]).filter(function(v){return v.id==id})[0]}
function ok(k){var p=P[pid(k)];return !!p&&(!isV(k)||!!vOf(k))&&(!isP(k)||!!(p.parts&&p.parts[+k.split('~')[1]]))}
var pm='p';
function vmin(x){var m=x.price;x.variants.forEach(function(v){if((v.p||x.price)<m)m=v.p||x.price});return m}
function vbtn(x){var n=0;for(var k in cart){if(k.indexOf(x.id+'@')==0&&!isG(k))n+=cart[k]}return '<button class="add" onclick="variantsUI(\''+x.id+'\')">'+(n?'الأشكال المختارة: '+n+' ✓':'اختار الشكل')+'</button>'}
function variantsUI(id){pv=id;pm='v';var p=P[id];document.getElementById('sh').style.display='flex';document.getElementById('pn').innerHTML='<h2 style="margin:0 0 6px">'+p.name+' — اختار الشكل</h2>'+p.variants.map(function(v){return '<div class="row"><span style="display:flex;align-items:center;gap:10px"><span style="width:52px;height:52px;border-radius:10px;overflow:hidden;background:#fafaf8;flex:none;display:flex;align-items:center;justify-content:center;color:#ccc;font-weight:700">'+(v.img&&IM(v.id)?'<img decoding="async" onload="this.classList.add(\'ld\')" onerror="this.style.display=\'none\';this.classList.add(\'ld\')" src="'+IM(v.id)+'" onclick="zoomImg(this.src)" style="width:100%;height:100%;object-fit:cover">':v.n.charAt(0))+'</span><span>'+v.n+'<br><small style="color:#6b6b66">'+fmt(v.p||p.price)+' ج.م</small></span></span>'+ctl(id+'@'+v.id)+'</div>'}).join('')+'<button class="send" style="background:#111;color:#f5c400" onclick="closeSh()">تم</button>'}
function isG(k){return /~g$/.test(k)}
function gramOf(k){var p=P[pid(k)];return isV(k)?(vOf(k).g||p.gram):p.gram}
function isP(k){return /~\d+$/.test(k)}
var pv=null;
function line(k){var p=P[pid(k)];if(isG(k))return Math.round(gramOf(k)*cart[k]);if(isV(k))return Math.round((vOf(k).p||p.price)*cart[k]);if(isP(k))return Math.round(p.parts[+k.split('~')[1]].p*cart[k]);return p.price*cart[k]}
function tot(){var n=0,c=0;for(var k in cart){if(ok(k)){n+=line(k);c+=isG(k)?1:cart[k]}}return[n,c]}
function minG(){return CATALOG.minGrams||100}
function setG(k,v){var n=parseInt(digits(String(v)))||0,m=minG();if(n>0&&n<m)n=m;if(n<=0)delete cart[k];else cart[k]=n;save();draw();cartUI()}
var gk='';
function closeSh(){document.getElementById('sh').style.display='none';pv=null}

function gbtnV(x,v){var key=x.id+'@'+v.id+'~g',g=cart[key],gp=v.g||x.gram;return gp?'<button class="add gb" onclick="addG(\''+x.id+'@'+v.id+'\')">'+(g?'بالجرام: '+g+' جم ✓':'بالجرام ('+fmt(gp)+' ج/جم)')+'</button>':''}

function cartUI(){
  var ks=Object.keys(cart).filter(ok),r=tot();
  if(!ks.length){document.getElementById('sh').style.display='none';return}
  document.getElementById('pn').innerHTML='<h2 style="margin:0 0 6px">سلة الطلب</h2>'+ks.map(function(k){var g=isG(k),p=P[pid(k)],pc=isP(k)?p.parts[+k.split('~')[1]]:null,vv=isV(k)?vOf(k):null;return '<div class="row"><span style="flex:1">'+p.name+(g?(vv?' — '+vv.n:'')+' (بالجرام)':pc?' — '+pc.n:vv?' — '+vv.n:'')+'<br><small style="color:#6b6b66">'+(g?fmt(gramOf(k))+' ج.م / جرام':fmt(pc?pc.p:vv?(vv.p||p.price):p.price)+' ج.م')+'</small><br><input class="nt" placeholder="ملاحظة على المنتج (اختياري)" value="'+esc(CN[k])+'" oninput="setN(\''+k+'\',this.value)"></span>'+(g?'<div class="qty"><input type="number" inputmode="numeric" value="'+cart[k]+'" onchange="setG(\''+k+'\',this.value)" style="width:64px;border:0;background:none;text-align:center;font-weight:700;font-size:16px"><span style="font-size:13px">جم</span><button onclick="setG(\''+k+'\',0)">×</button></div>':ctl(k))+'</div>'}).join('')+
  '<div class="tot"><span>الإجمالي</span><span>'+fmt(r[0])+' ج.م</span></div>'+
  '<div class="lb">بيانات التوصيل (كلها مطلوبة)</div>'+
  '<input class="f" placeholder="الاسم بالكامل / اسم الصالون" value="'+esc(F.n)+'" oninput="setF(\'n\',this.value)">'+

  '<div class="er" id="er"></div><button class="send" onclick="send()">إرسال الطلب على واتساب</button><button class="clr" onclick="clr(this)">تفريغ السلة</button>';
}
function digits(t){return t.replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})}
function check(){
  var ph=digits(F.p||'').replace(/[\s\-()]/g,'');
  if(!(F.n||'').trim())return 'اكتب الاسم';
  if(!/^\+?\d{10,15}$/.test(ph))return 'اكتب رقم موبايل صحيح';
  if((F.a||'').trim().length<15)return 'اكتب العنوان بالتفصيل (المحافظة والمنطقة والشارع ورقم العمارة)';
  return '';
}
function msg(){
  var l=['طلب جديد - '+CATALOG.brand,'','الاسم: '+F.n.trim(),'الموبايل: '+digits(F.p).trim(),'العنوان: '+F.a.trim(),'','الأصناف:'];
  Object.keys(cart).forEach(function(k){var p=P[pid(k)];if(!ok(k))return;var nt=(CN[k]||'').trim();l.push(isG(k)&&isV(k)?'• '+p.name+' — '+vOf(k).n+' — '+cart[k]+' جرام = '+fmt(line(k)):isV(k)?'• '+p.name+' — '+vOf(k).n+' × '+cart[k]+' = '+fmt(line(k)):isG(k)?'• '+p.name+' — '+cart[k]+' جرام = '+fmt(line(k)):isP(k)?'• '+p.name+' — '+p.parts[+k.split('~')[1]].n+' × '+cart[k]+' = '+fmt(line(k)):'• '+p.name+(p.gram?' (لتر)':'')+' × '+cart[k]+' = '+fmt(line(k)));if(nt)l.push('   ملاحظة: '+nt)});
  l.push('','الإجمالي: '+fmt(tot()[0])+' ج.م');
  return 'https://wa.me/'+CATALOG.whatsapp+'?text='+encodeURIComponent(l.join('\n'));
}
function send(){var e=check(),el=document.getElementById('er');if(e){el.textContent=e;return}el.textContent='';location.href=msg()}

var lb={list:[],i:0,sx:0,sy:0,multi:false,s:1,x:0,y:0,p:{},d0:0,s0:1,mx:0,my:0,moved:false,tap:0,tm:null};
function lbT(){document.querySelector('#lb img').style.transform='translate(-50%,-50%) translate('+lb.x+'px,'+lb.y+'px) scale('+lb.s+')'}
function lbN(){var n=lb.list.length,m=n>1?'block':'none';document.getElementById('lbp').style.display=m;document.getElementById('lbq').style.display=m;document.getElementById('lbn').textContent=n>1?(lb.i+1)+' / '+n:''}
function zoomImg(src,list,i){var L=document.getElementById('lb');lb.list=list||[src];lb.i=i||0;L.querySelector('img').src=lb.list[lb.i];lb.s=1;lb.x=0;lb.y=0;lb.p={};lbT();lbN();L.style.display='block'}
function zoomItem(id){var x=P[id],l=[IM(x.id)].concat((x.gal||[]).map(function(g){return IM(g)}).filter(Boolean));zoomImg(l[0],l,0)}
function lbGo(d){var n=lb.i+d;if(n<0||n>=lb.list.length)return;lb.i=n;lb.s=1;lb.x=0;lb.y=0;document.querySelector('#lb img').src=lb.list[n];lbT();lbN()}
function lbClose(){document.getElementById('lb').style.display='none'}
(function(){
  var L=document.getElementById('lb');
  function zoomAt(ns,mx,my){ns=Math.max(1,Math.min(6,ns));var r=ns/lb.s,ax=mx-innerWidth/2,ay=my-innerHeight/2;lb.x=ax-(ax-lb.x)*r;lb.y=ay-(ay-lb.y)*r;lb.s=ns;if(ns===1){lb.x=0;lb.y=0}lbT()}
  function pts(){return Object.keys(lb.p).map(function(k){return lb.p[k]})}
  function mid(a){return a.length>1?{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}:a[0]}
  L.addEventListener('pointerdown',function(e){if(e.target.tagName==='BUTTON')return;L.setPointerCapture(e.pointerId);lb.p[e.pointerId]={x:e.clientX,y:e.clientY};lb.moved=false;var a=pts();if(a.length===1){lb.multi=false;lb.sx=e.clientX;lb.sy=e.clientY}else lb.multi=true;if(a.length===2){lb.d0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;lb.s0=lb.s}var m=mid(a);lb.mx=m.x;lb.my=m.y});
  L.addEventListener('pointermove',function(e){if(!lb.p[e.pointerId])return;lb.p[e.pointerId]={x:e.clientX,y:e.clientY};var a=pts(),m=mid(a);
    if(Math.abs(m.x-lb.mx)+Math.abs(m.y-lb.my)>4)lb.moved=true;
    if(a.length>=2){zoomAt(lb.s0*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/lb.d0,m.x,m.y);lb.moved=true}
    if(lb.s>1){lb.x+=m.x-lb.mx;lb.y+=m.y-lb.my;lbT()}
    lb.mx=m.x;lb.my=m.y});
  function up(e){if(!lb.p[e.pointerId])return;var wasOne=pts().length===1;delete lb.p[e.pointerId];var a=pts();if(a.length){var m=mid(a);lb.mx=m.x;lb.my=m.y;lb.s0=lb.s;if(a.length===2)lb.d0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1}
    if(wasOne&&lb.moved&&!lb.multi&&lb.s===1&&lb.list.length>1){var dx=e.clientX-lb.sx,dy=e.clientY-lb.sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){lbGo(dx<0?1:-1);return}}
    if(!wasOne||lb.moved)return;
    var now=Date.now();
    if(now-lb.tap<300){clearTimeout(lb.tm);lb.tap=0;zoomAt(lb.s>1?1:2.5,e.clientX,e.clientY)}
    else{lb.tap=now;lb.tm=setTimeout(function(){if(lb.s===1)lbClose()},300)}}
  L.addEventListener('pointerup',up);L.addEventListener('pointercancel',up);
  L.addEventListener('wheel',function(e){e.preventDefault();zoomAt(lb.s*(e.deltaY<0?1.2:1/1.2),e.clientX,e.clientY)},{passive:false});
})();
function setBar(h){document.getElementById('imbar').innerHTML=h}
function loadImgs(n){
  setBar('<span style="font-size:12px;color:#bbb">جاري تحميل الصور…</span>');
  fetch('images.js',{cache:'no-cache'}).then(function(r){
    if(!r.ok)throw 0;
    if(!r.body||!r.body.getReader)return r.text();
    var rd=r.body.getReader(),dc=new TextDecoder(),txt='',got=0;
    return (function pump(){return rd.read().then(function(x){if(x.done)return txt+dc.decode();got+=x.value.length;txt+=dc.decode(x.value,{stream:true});setBar('<span style="font-size:12px;color:#bbb">جاري تحميل الصور… '+(got/1048576).toFixed(1)+' ميجا</span>');return pump()})})();
  }).then(function(t){IMGS=(new Function(t+';return IMGS'))();setBar('');draw()})
  .catch(function(){
    if(n<3){setBar('<span style="font-size:12px;color:#bbb">إعادة محاولة تحميل الصور…</span>');setTimeout(function(){loadImgs(n+1)},2000*(n+1))}
    else setBar('<button onclick="loadImgs(0)" style="margin-top:6px;padding:6px 12px;border:0;border-radius:8px;background:#f5c400;color:#111;font-weight:700;font-size:13px">تعذر تحميل الصور — اضغط للمحاولة تاني</button>');
  });
}
