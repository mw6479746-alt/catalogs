<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>إدارة الكتالوج</title>
<style>
:root{--ink:#111;--gold:#f5c400;--line:#e5e5df;--mut:#6b6b66}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#f5f5f2;color:var(--ink);padding:0 0 130px}
header{background:var(--ink);color:var(--gold);padding:calc(14px + env(safe-area-inset-top)) 14px 12px;font-weight:700;font-size:18px;position:sticky;top:0;z-index:5}
header small{display:block;color:#bbb;font-weight:400;font-size:12px;margin-top:2px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;margin:12px;padding:12px}
.sec{display:flex;gap:8px;align-items:center}.sec input{flex:1;font-size:17px;font-weight:700}
input{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;font-family:inherit;width:100%}
button{border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:700;font-family:inherit;background:var(--ink);color:var(--gold)}
button.g{background:var(--gold);color:var(--ink)}button.r{background:#fde8e6;color:#c0392b}button.l{background:#eee;color:var(--ink)}
.it{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.th{flex:none;width:54px;height:54px;border-radius:10px;background:#eee;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut);text-align:center}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.th input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.f{flex:1;display:flex;flex-direction:column;gap:6px}.pr{display:flex;gap:6px;align-items:center}.pr input{width:110px}.pr span{font-size:13px;color:var(--mut)}
.ft{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6}
.ft .b{display:flex;gap:8px}.ft button{flex:1}.ft p{font-size:12.5px;color:var(--mut);margin-bottom:8px;line-height:1.5}
.top{display:flex;gap:8px}.top input{flex:1}
textarea{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;font-family:inherit;width:100%;resize:vertical;min-height:70px}
</style></head><body>
<header>إدارة الكتالوج<small>عدّل وبعدين نزّل الملفين وارفعهم على GitHub</small></header>
<div class="box"><input id="bI" placeholder="اسم الكتالوج (بيظهر فوق وفي رسالة الطلب)"></div>
<div class="box"><div style="font-size:13px;color:#6b6b66;margin-bottom:6px">اسم الكتالوج (بيظهر فوق وفي رسالة الطلب)</div><input id="br"></div>
<div class="box"><div class="top"><input id="ns" placeholder="اسم قسم جديد"><button class="g" data-a="addsec">+ قسم</button></div></div>
<div class="box"><div style="font-size:13px;color:#6b6b66;margin-bottom:6px">نقل الصور القديمة لملفات (مرة واحدة بس)</div><button class="g" style="width:100%" onclick="migrate()">حمّل الصور القديمة</button><div id="mr" style="font-size:13px;color:#6b6b66;margin-top:6px;line-height:1.7"></div></div>
<div id="m"></div>
<div class="ft"><p id="st"></p><div class="b"><button class="g" data-a="dl" data-f="p">⬇️ products.js</button><button class="g" onclick="dlImgs()">⬇️ الصور <span id="ic"></span></button></div></div>
<script src="products.js"></script>
<script src="thumbs.js" onerror="void 0"></script>
<script>
var FRESH={},T=(typeof IMGT!=='undefined')?JSON.parse(JSON.stringify(IMGT)):{},imgsOK=false,S=JSON.parse(JSON.stringify(CATALOG)),I={},dirty=false;
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function st(){var n=0;S.sections.forEach(function(s){n+=s.items.length});document.getElementById('st').textContent=S.sections.length+' أقسام • '+n+' منتج'+(dirty?' — فيه تعديلات لسه ماتنزّلتش':'')}
function gsec(x,a,b){return '<div class="pr" style="flex-wrap:wrap;gap:6px;margin-top:6px">'+(x.gal||[]).map(function(g,j){return '<div class="th" style="width:44px;height:44px">'+'<img src="'+SRC(g)+'">'+'<button class="r" data-a="delg" data-s="'+a+'" data-i="'+b+'" data-j="'+j+'" style="position:absolute;top:0;right:0;padding:0 6px;font-size:13px;border-radius:0 0 0 8px">×</button></div>'}).join('')+'<label style="display:inline-block;padding:7px 10px;border-radius:10px;background:#eee;font-size:13px;font-weight:700;cursor:pointer">+ صور إضافية<input type="file" accept="image/*" multiple data-k="gimg" data-s="'+a+'" data-i="'+b+'" style="display:none"></label></div>'}
function vsec(x,a,b){return '<div style="margin-top:4px">'+(x.variants||[]).map(function(v,j){var at=' data-s="'+a+'" data-i="'+b+'" data-j="'+j+'"';return '<div class="pr" style="gap:5px;margin-top:5px"><div class="th" style="width:40px;height:40px;flex:none">'+(v.img?'<img src="'+SRC(v.id)+'">':'+')+'<input type="file" accept="image/*" data-k="vimg"'+at+'></div><input data-k="vn"'+at+' placeholder="اسم الشكل" value="'+esc(v.n)+'" style="flex:1;width:auto"><input type="number" step="any" inputmode="decimal" data-k="vp"'+at+' placeholder="سعر" value="'+(v.p||'')+'" style="width:70px"><button class="r" data-a="delv"'+at+' style="padding:8px 10px">×</button></div><input data-k="vd"'+at+' placeholder="بيانات الشكل: وصف، مقاس، لون... (اختياري)" value="'+esc(v.d)+'" style="margin-top:4px;font-size:14px"><input type="number" step="any" inputmode="decimal" data-k="vg"'+at+' placeholder="سعر الجرام لهذا الشكل (اختياري)" value="'+(v.g||'')+'" style="margin-top:4px;font-size:14px">'}).join('')+'<button class="l" data-a="addv" data-s="'+a+'" data-i="'+b+'" style="padding:6px 10px;font-size:13px;margin-top:6px">+ شكل / نوع</button></div>'}
function partsAdm(x,a,b){var at=' data-s="'+a+'" data-i="'+b+'"';
  if(!x.parts)return '<button class="l" data-a="addparts"'+at+' style="padding:6px 10px;font-size:13px;margin-top:4px">+ مجموعة قطع (4 خانات)</button>';
  return '<div style="margin-top:6px;font-size:13px;color:#6b6b66">قطع المجموعة (اسم + سعر كل قطعة)</div>'+x.parts.map(function(q,j){var aj=at+' data-j="'+j+'"';return '<div class="pr" style="gap:5px;margin-top:5px"><input data-k="pn"'+aj+' placeholder="اسم القطعة" value="'+esc(q.n)+'" style="flex:1;width:auto"><input type="number" step="any" inputmode="decimal" data-k="pt"'+aj+' placeholder="سعر" value="'+(q.p||'')+'" style="width:80px"><button class="r" data-a="delpart"'+aj+' style="padding:8px 10px">×</button></div>'}).join('')+'<button class="l" data-a="addparts"'+at+' style="padding:6px 10px;font-size:13px;margin-top:6px">+ قطعة</button>'}
function render(){
  document.getElementById('m').innerHTML=S.sections.map(function(s,a){
    return '<div class="box"><div class="sec"><input data-k="sn" data-s="'+a+'" value="'+esc(s.name)+'"><button class="r" data-a="delsec" data-s="'+a+'">حذف</button></div>'+
    s.items.map(function(x,b){return '<div class="it"><div class="th">'+(x.img?'<img src="'+SRC(x.id)+'">':'+ صورة')+'<input type="file" accept="image/*" data-k="img" data-s="'+a+'" data-i="'+b+'"></div>'+
      '<div class="f"><input data-k="n" data-s="'+a+'" data-i="'+b+'" placeholder="اسم المنتج" value="'+esc(x.name)+'"><div class="pr"><input type="number" inputmode="numeric" data-k="p" data-s="'+a+'" data-i="'+b+'" value="'+x.price+'"><span>ج.م</span></div><div class="pr"><input type="number" step="any" inputmode="decimal" data-k="g" data-s="'+a+'" data-i="'+b+'" placeholder="سعر الجرام (اختياري)" value="'+(x.gram||'')+'" style="width:170px"><span>ج.م/جم</span></div>'+partsAdm(x,a,b)+'<textarea data-k="ds" data-s="'+a+'" data-i="'+b+'" rows="3" placeholder="وصف المنتج وتفاصيله (اختياري)">'+esc(x.desc)+'</textarea>'+vsec(x,a,b)+gsec(x,a,b)+'</div>'+
      '<button class="r" data-a="del" data-s="'+a+'" data-i="'+b+'">×</button></div>'}).join('')+
    '<button class="l" style="width:100%;margin-top:8px" data-a="add" data-s="'+a+'">+ منتج جديد في '+esc(s.name)+'</button></div>'}).join('');
  st();
}
function pic(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);var tc=document.createElement('canvas'),tk=Math.min(1,28/Math.max(im.width,im.height));tc.width=Math.max(1,Math.round(im.width*tk));tc.height=Math.max(1,Math.round(im.height*tk));tc.getContext('2d').drawImage(im,0,0,tc.width,tc.height);cb(c.toDataURL('image/jpeg',.85),tc.toDataURL('image/jpeg',.45))};im.src=r.result};r.readAsDataURL(file)}
var m=document.getElementById('m');
m.addEventListener('input',function(e){var t=e.target,k=t.dataset.k,s=S.sections[t.dataset.s];if(!k||k=='img')return;
  if(k=='sn')s.name=t.value;else{var x=s.items[t.dataset.i];if(k=='n')x.name=t.value;else if(k=='ds'){if(t.value.trim())x.desc=t.value;else delete x.desc}else if(k=='vn'){x.variants[t.dataset.j].n=t.value}else if(k=='vd'){var vq=x.variants[t.dataset.j];if(t.value.trim())vq.d=t.value;else delete vq.d}else if(k=='vg'){var wg=parseFloat(t.value);if(wg>0)x.variants[t.dataset.j].g=wg;else delete x.variants[t.dataset.j].g}else if(k=='vp'){var w=parseFloat(t.value);if(w>0)x.variants[t.dataset.j].p=w;else delete x.variants[t.dataset.j].p}else if(k=='pt'){x.parts[t.dataset.j].p=parseFloat(t.value)||0}else if(k=='pn'){x.parts[t.dataset.j].n=t.value}else if(k=='g'){var v=parseFloat(t.value);if(v>0)x.gram=v;else delete x.gram}else x.price=parseInt(t.value)||0}dirty=true;st()});
m.addEventListener('change',function(e){var t=e.target;var kk=t.dataset.k;if(kk=='gimg'){var xg=S.sections[t.dataset.s].items[t.dataset.i],fl=[].slice.call(t.files),n=fl.length;if(!n)return;fl.forEach(function(f){pic(f,function(d,tt){var gid='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);I[gid]=d;T[gid]=tt;(xg.gal=xg.gal||[]).push(gid);if(--n===0){dirty=true;render()}})});return}if((kk!='img'&&kk!='vimg')||!t.files[0])return;var x=S.sections[t.dataset.s].items[t.dataset.i],o=kk=='vimg'?x.variants[t.dataset.j]:x;
  pic(t.files[0],function(d,tt){I[o.id]=d;T[o.id]=tt;o.img=1;dirty=true;render()})});
document.addEventListener('click',function(e){var t=e.target.closest('button');if(!t||!t.dataset.a)return;var a=t.dataset.a,s=S.sections[t.dataset.s];
  if(a=='addsec'){var v=document.getElementById('ns').value.trim();if(!v)return;S.sections.push({name:v,items:[]});document.getElementById('ns').value=''}
  else if(a=='delsec'){if(!confirm('حذف القسم "'+s.name+'" بكل منتجاته؟'))return;S.sections.splice(t.dataset.s,1)}
  else if(a=='add'){var nid='n'+Date.now().toString(36);FRESH[nid]=1;s.items.push({id:nid,name:'',price:0})}
  else if(a=='del'){if(!confirm('حذف "'+(s.items[t.dataset.i].name||'المنتج')+'"؟'))return;s.items.splice(t.dataset.i,1)}
  else if(a=='addv'){var x=s.items[t.dataset.i];(x.variants=x.variants||[]).push({id:'v'+Date.now().toString(36),n:''})}
  else if(a=='delv'){var x2=s.items[t.dataset.i];x2.variants.splice(t.dataset.j,1);if(!x2.variants.length)delete x2.variants}
  else if(a=='delg'){var xd=s.items[t.dataset.i];xd.gal.splice(t.dataset.j,1);if(!xd.gal.length)delete xd.gal}
  else if(a=='addparts'){var xp=s.items[t.dataset.i];if(!xp.parts)xp.parts=[{n:'',p:0},{n:'',p:0},{n:'',p:0},{n:'',p:0}];else xp.parts.push({n:'',p:0})}
  else if(a=='delpart'){var xq=s.items[t.dataset.i];xq.parts.splice(t.dataset.j,1);if(!xq.parts.length)delete xq.parts}
  else if(a=='dl'){return dl(t.dataset.f)}
  dirty=true;render();if(a=='add'){var l=m.querySelectorAll('.box')[t.dataset.s].querySelectorAll('.it');l[l.length-1].querySelector('input[data-k=n]').focus()}});
function build(){var im={};S.sections.forEach(function(s){s.items.forEach(function(x){if(x.img&&I[x.id])im[x.id]=I[x.id];(x.gal||[]).forEach(function(g){if(I[g])im[g]=I[g]});(x.variants||[]).forEach(function(v){if(v.img&&I[v.id])im[v.id]=I[v.id]})})});
  return{p:'const CATALOG='+JSON.stringify(S,null,1)+';\n',i:'const IMGS='+JSON.stringify(im)+';\n'}}
function dl(f){
  if(f=='i'&&!imgsOK){alert('استنى لحد ما الصور تخلص تحميل');return}
  var bad=0,zero=0;S.sections.forEach(function(s){s.items.forEach(function(x){if(!x.name.trim())bad++;(x.parts||[]).forEach(function(q){if(!(q.n||'').trim())bad++});(x.variants||[]).forEach(function(v){if(!(v.n||'').trim())bad++});if(!x.price)zero++})});
  if(bad){alert('فيه '+bad+' منتج من غير اسم. اكتب الاسم أو احذفه.');return}
  if(zero&&!confirm(zero+' منتج سعره صفر. تكمل؟'))return;
  if(f=='p'){var nw=Date.now();S.sections.forEach(function(s){s.items.forEach(function(x){if(FRESH[x.id]&&!x.added)x.added=nw})})}
  var o=build(),b=new Blob([f=='p'?o.p:o.i],{type:'text/javascript'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=f=='p'?'products.js':'images.js';document.body.appendChild(a);a.click();a.remove();dirty=false;st();
}
var bI=document.getElementById('bI');bI.value=S.brand||'';bI.oninput=function(){S.brand=this.value;dirty=true;st()};
document.getElementById("br").value=S.brand||"";document.getElementById("br").oninput=function(){S.brand=this.value;dirty=true;st()};
var DL={},ORIG={p1:1,p2:1,p3:1,p4:1,p5:1,p6:1,p7:1,p8:1,p9:1,p10:1,p11:1,p12:1,p13:1,p14:1,p15:1,p16:1,p17:1,p18:1,p19:1,p20:1,p21:1,p22:1,p23:1,p24:1,p25:1,p26:1,p27:1,p28:1,p29:1,p30:1,p31:1,p32:1,p33:1,p34:1,p35:1,p36:1,p37:1,p38:1,p39:1,p40:1,p41:1,p42:1,p43:1,p44:1,p45:1,p46:1,p47:1,p53:1,p54:1,p55:1,p56:1,p57:1,p58:1};
function SRC(id){return I[id]||('img-'+id+'.jpg')}
function used(){var u={};S.sections.forEach(function(s){s.items.forEach(function(x){if(x.img)u[x.id]=1;(x.gal||[]).forEach(function(g){u[g]=1});(x.variants||[]).forEach(function(v){if(v.img)u[v.id]=1})})});return u}
function pend(){var u=used();return Object.keys(I).filter(function(k){return u[k]&&!DL[k]})}
var _st=st;st=function(){_st();var ic=document.getElementById('ic');if(ic)ic.textContent='('+pend().length+')'};
function dlT(){var u=used(),m={};Object.keys(T).forEach(function(k){if(u[k])m[k]=T[k]});var b=new Blob(['var IMGT='+JSON.stringify(m)+';\n'],{type:'text/javascript'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='thumbs.js';document.body.appendChild(l);l.click();l.remove()}
function dlImgs(){var ks=pend();if(!ks.length){alert('مفيش صور جديدة للتنزيل');return}var i=0;(function nx(){if(i>=ks.length){dlT();return}var k=ks[i++],l=document.createElement('a');l.href=I[k];l.download='img-'+k+'.jpg';document.body.appendChild(l);l.click();l.remove();DL[k]=1;st();setTimeout(nx,500)})()}
function migrate(){var o=document.getElementById('mr');o.textContent='جاري التحميل…';fetch('images.js',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){var L=(new Function(t+';return IMGS'))(),n=0;Object.keys(L).forEach(function(k){if(!I[k]&&!ORIG[k]){I[k]=L[k];n++}});o.textContent='اتحمّلت '+n+' صورة. دوس "⬇️ الصور" تحت، وارفع الملفات اللي هتنزل (img-...jpg) على GitHub.';render()}).catch(function(){o.textContent='مفيش صور قديمة تتنقل (ملف images.js مش موجود).'})}
render();
</script></body></html>
